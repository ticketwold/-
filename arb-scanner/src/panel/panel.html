<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arb Scanner</title>
  <link rel="stylesheet" href="./panel.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div>
          <h1>Arb Scanner</h1>
          <p class="subtitle">x10 · BC.Game 양방</p>
        </div>
      </div>
      <span id="status" class="badge">—</span>
    </header>

    <section class="metrics">
      <div class="metric">
        <span class="label">수익률</span>
        <strong id="profit" class="value">—</strong>
        <span class="hint">목표 <span id="min-profit">—</span></span>
      </div>
      <div class="metric">
        <span class="label">USDT/KRW</span>
        <strong id="rate" class="value">—</strong>
        <span class="hint">빗썸</span>
      </div>
      <div class="metric">
        <span class="label">BC 베팅금</span>
        <strong class="value"><span id="bc-usdt">—</span> USDT</strong>
        <span class="hint">leg2</span>
      </div>
    </section>

    <section class="controls card">
      <label class="field">x10 베팅금 (원)
        <input type="number" id="x10-krw" min="1000" step="1000" />
      </label>
      <div class="btn-row">
        <button id="sync-btn" type="button" class="btn secondary">금액 동기화</button>
        <button id="arm-btn" type="button" class="btn arm-off">자동배팅 OFF</button>
        <button id="strike-btn" type="button" class="btn danger">수동 베팅</button>
      </div>
    </section>

    <section class="slips">
      <div class="card slip-card">
        <h2>배팅카트 (x10)</h2>
        <div id="x10-slip" class="slip-body">—</div>
      </div>
      <div class="card slip-card">
        <h2>배팅카트 (BC)</h2>
        <div id="bc-slip" class="slip-body">—</div>
      </div>
    </section>

    <section class="card">
      <h2>양방 기회</h2>
      <div id="opps" class="opps">—</div>
    </section>

    <footer class="footer">
      <button id="refresh-btn" type="button" class="btn">새로고침</button>
      <button id="diag-btn" type="button" class="btn secondary">진단</button>
      <a href="options.html" target="_blank" class="btn link">설정</a>
    </footer>
    <div id="tab-status" class="tab-status">—</div>
    <div id="toast" class="toast" hidden></div>
  </div>
  <script type="module" src="./panel.ts"></script>
</body>
</html>
