<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <div class="header-row">
    <div>
      <h1>⚡ 양방 베팅 봇</h1>
      <div class="sub">텐텐뱃 + Polymarket / BC.Game · v5.10.0</div>
    </div>
    <button id="openPanelBtn" class="btn-icon" title="별도 창으로 열기">⬜</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="search">🔍 라이브 서치</button>
  <button class="tab" data-tab="slip">📋 슬립 비교</button>
</nav>

<!-- 라이브 서치 -->
<section id="tab-search" class="panel active">
  <div class="site-pick row two-col">
    <div>
      <label>왼쪽 (A)</label>
      <select id="searchLeg1Site">
        <option value="bti">텐텐뱃 (x10x10s)</option>
      </select>
    </div>
    <div>
      <label>오른쪽 (B)</label>
      <select id="searchLeg2Site">
        <option value="auto">자동</option>
        <option value="polymarket">Polymarket</option>
        <option value="bcgame">BC.Game</option>
      </select>
    </div>
  </div>
  <div class="row">
    <label>최소 수익률 (%)</label>
    <input type="number" id="minProfit" value="1" min="0" step="0.1">
  </div>
  <div class="btn-row">
    <button id="searchStart" class="btn primary">서치 시작</button>
    <button id="searchStop" class="btn" disabled>정지</button>
  </div>
  <div id="searchStats" class="hint">왼쪽(A) 텐텐뱃 + 오른쪽(B) 사이트 선택 후 서치 시작</div>
  <div id="searchResults" class="results"></div>
  <button id="openPanelFromSearch" class="btn link-btn">↗ 큰 창으로 서치 보기</button>
</section>

<!-- 슬립 비교 -->
<section id="tab-slip" class="panel">
  <div class="site-pick row two-col">
    <div>
      <label>왼쪽 (A)</label>
      <select id="slipLeg1Site">
        <option value="bti">텐텐뱃 (x10x10s)</option>
      </select>
    </div>
    <div>
      <label>오른쪽 (B)</label>
      <select id="slipLeg2Site">
        <option value="auto">자동</option>
        <option value="polymarket">Polymarket</option>
        <option value="bcgame">BC.Game</option>
      </select>
    </div>
  </div>
  <div class="slip-grid">
    <div>
      <label>텐텐뱃</label>
      <div class="slip-box">
        <div class="odds" id="btiOdds">-</div>
        <div class="meta" id="btiMeta">-</div>
      </div>
    </div>
    <div>
      <label id="leg2Label">Polymarket / BC.Game</label>
      <div class="slip-box">
        <div class="odds" id="polyOdds">-</div>
        <div class="meta" id="polyMeta">-</div>
      </div>
    </div>
  </div>

  <div class="profit-box">
    <div class="label">예상 수익률</div>
    <div class="profit" id="profit">-</div>
    <div class="hint" id="profitHint">텐텐뱃 금액 입력 후 계산 시작 — 예측 사이트 금액 자동 입력</div>
  </div>

  <div class="row">
    <label>최소 수익률 (%)</label>
    <input type="number" id="slipMinProfit" value="1" min="0" step="0.1">
  </div>
  <div class="row">
    <label>텐텐뱃 베팅금 (원) — 슬립에 직접 입력</label>
    <input type="number" id="btiBet" value="10000" min="1000" step="1000">
  </div>
  <div class="row">
    <label>USDT 환율 (원)</label>
    <input type="number" id="usdRate" value="1400" min="1000" step="10">
  </div>

  <div class="calc-box">
    <div class="calc-title">베팅 금액</div>
    <div><span>텐텐뱃</span> <strong id="calcBti">-</strong></div>
    <div><span id="calcLeg2Label">Polymarket / BC.Game</span> <strong id="calcPoly">-</strong></div>
  </div>

  <div class="payout-box">
    <div class="payout-row">
      <span class="payout-label">텐텐뱃 당첨금</span>
      <div class="payout-main">
        <strong id="payoutBti">-</strong>
        <span id="payoutBtiPct" class="payout-pct">-</span>
      </div>
    </div>
    <div class="payout-row">
      <span class="payout-label" id="payoutLeg2Label">예측 당첨금</span>
      <div class="payout-main">
        <strong id="payoutPoly">-</strong>
        <span id="payoutPolyUsd" class="payout-usd">-</span>
        <span id="payoutPolyPct" class="payout-pct">-</span>
      </div>
    </div>
    <div class="payout-compare" id="payoutCompare">-</div>
  </div>

  <div class="bet-box">
    <div class="row two-col bet-options">
      <label class="check-row">
        <input type="checkbox" id="autoBet" checked />
        수익 구간 자동 배팅
      </label>
      <div>
        <label>쿨다운 (초)</label>
        <input type="number" id="betCooldown" value="8" min="3" max="60" step="1">
      </div>
    </div>
    <div class="btn-row">
      <button id="betNowBtn" class="btn strike" type="button">⚡ 지금 배팅</button>
    </div>
    <label class="check-row">
      <input type="checkbox" id="ignoreProfit" />
      수익률 무시 (테스트만)
    </label>
    <div class="hint" id="betHint">모니터링 시작 → 수익 구간 시 자동 배팅</div>
  </div>

  <div class="btn-row">
    <button id="botStart" class="btn primary">모니터링·자동배팅</button>
    <button id="botStop" class="btn" disabled>계산 정지</button>
    <button id="diagBtn" class="btn small">진단</button>
  </div>

  <div class="history-box">
    <div class="history-head">
      <span class="history-title">히스토리</span>
      <button id="clearHistoryBtn" class="btn tiny" type="button">지우기</button>
    </div>
    <div id="historyList" class="history-list">
      <div class="hint">계산 시작 후 배당·수익률이 기록됩니다</div>
    </div>
  </div>
</section>

<div id="log" class="log"></div>

<script src="sites_config.js"></script>
<script src="odds.js"></script>
<script src="poly_api.js"></script>
<script src="popup.js"></script>
</body>
</html>
