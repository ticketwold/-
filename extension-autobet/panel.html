<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">⚡</div>
      <div class="brand-text">
        <h1>양방 자동배팅</h1>
        <p class="version" id="versionLabel">Pro · v2.5.5</p>
      </div>
    </div>
    <div id="armStatus" class="status-pill disarmed" role="status">대기</div>
  </header>

  <section class="card dashboard-card">
    <div class="metric-grid">
      <div class="metric">
        <span class="metric-label">수익률</span>
        <strong id="profitVal" class="metric-value">—</strong>
      </div>
      <div class="metric">
        <span class="metric-label" id="oddsLabel">텐텐뱃 / B</span>
        <strong id="oddsVal" class="metric-value mono">— / —</strong>
      </div>
    </div>
    <p class="status-hint" id="statusHint">오른쪽 사이트를 선택하고 [연결]을 눌러 시작하세요</p>
  </section>

  <section class="card">
    <div class="card-head">
      <h2 class="card-title">왼쪽(A) 텐텐뱃</h2>
      <span id="btiSyncStatus" class="sync-badge">미확인</span>
    </div>
    <div class="site-sync-row">
      <button id="btiOpenBtn" type="button" class="btn btn-open">텐텐뱃 열기</button>
      <button id="btiVerifyBtn" type="button" class="btn btn-accent">연결확인</button>
    </div>
    <p class="field-hint warn-hint">⚠ v2.5.5 — in-play sportscenter/betslip iframe 우선 인식</p>
  </section>

  <section class="card">
    <div class="card-head">
      <h2 class="card-title">오른쪽(B) 사이트</h2>
      <span id="syncStatus" class="sync-badge">미연결</span>
    </div>
    <div class="site-sync-row">
      <select id="leg2Site" class="input-select" aria-label="오른쪽 사이트 선택">
        <option value="bcgame">BC.Game</option>
        <option value="stake">Stake.com</option>
      </select>
      <button id="leg2OpenBtn" type="button" class="btn btn-open">사이트 열기</button>
      <button id="syncBtn" type="button" class="btn btn-accent">연결</button>
    </div>
    <p class="field-hint warn-hint">⚠ [사이트 열기] → 스포츠 페이지 → [연결]</p>
  </section>

  <section class="card">
    <h2 class="card-title">설정</h2>
    <div class="field">
      <label for="minProfit">최소 수익률 (%)</label>
      <input type="number" id="minProfit" class="input" value="1" step="0.1">
    </div>
    <div class="field-grid">
      <div class="field">
        <label for="btiBet">텐텐뱃 금액 (원)</label>
        <input type="number" id="btiBet" class="input" value="10000" min="1000" step="1000">
      </div>
      <div class="field">
        <label for="usdRate">USDT 환율</label>
        <input type="number" id="usdRate" class="input" value="1400" min="1000" step="10">
      </div>
    </div>
    <div class="field">
      <label for="cooldownMs">재배팅 쿨다운 (ms)</label>
      <input type="number" id="cooldownMs" class="input" value="0" min="0" step="100">
    </div>
    <label class="toggle">
      <input type="checkbox" id="useBridge" checked>
      <span class="toggle-ui"></span>
      <span class="toggle-text">양방배팅봇 신호 우선</span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="preSync" checked>
      <span class="toggle-ui"></span>
      <span class="toggle-text" id="preSyncLabel">실시간 금액 동기화</span>
    </label>
  </section>

  <section class="card actions-card">
    <div class="btn-grid">
      <button id="armBtn" type="button" class="btn btn-danger" disabled>오토시작</button>
      <button id="disarmBtn" type="button" class="btn btn-ghost" disabled>오토 멈춤</button>
    </div>
    <div class="btn-grid">
      <button id="scanBtn" type="button" class="btn btn-primary" disabled>배당 스캔</button>
      <button id="testBetBtn" type="button" class="btn btn-ghost" disabled>테스트 배팅</button>
    </div>
  </section>

  <section class="card log-card">
    <div class="card-head">
      <h2 class="card-title">로그</h2>
    </div>
    <div id="log" class="log" role="log" aria-live="polite"></div>
  </section>
</div>

<script src="sites_config.js"></script>
<script src="odds.js"></script>
<script src="bti_read.js"></script>
<script src="engine.js"></script>
<script src="poly_read.js"></script>
<script src="panel.js"></script>
</body>
</html>
