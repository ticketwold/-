<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header>
  <h1>⚡ 양방 자동배팅</h1>
  <div class="sub">배당 실시간 갱신 · v1.5.1</div>
</header>

<section class="status-box" id="statusBox">
  <div class="status-row">
    <span>상태</span>
    <strong id="armStatus" class="disarmed">해제</strong>
  </div>
  <div class="status-row">
    <span>수익률</span>
    <strong id="profitVal">-</strong>
  </div>
  <div class="status-row">
    <span>텐텐뱃 / BC.Game</span>
    <strong id="oddsVal">- / -</strong>
  </div>
  <div class="hint" id="statusHint">확장 아이콘 클릭 → 별도 창 열림 · 닫지 마세요</div>
</section>

<div class="row">
  <label>최소 수익률 (%) — 테스트: -10 입력 가능</label>
  <input type="number" id="minProfit" value="1" step="0.1">
</div>
<div class="row two-col">
  <div>
    <label>텐텐뱃 금액 (원)</label>
    <input type="number" id="btiBet" value="10000" min="1000" step="1000">
  </div>
  <div>
    <label>USDT 환율</label>
    <input type="number" id="usdRate" value="1400" min="1000" step="10">
  </div>
</div>
<div class="row">
  <label>오른쪽(B) 사이트</label>
  <select id="leg2Site">
    <option value="bcgame">BC.Game</option>
  </select>
</div>
<div class="row">
  <label>재배팅 쿨다운 (ms)</label>
  <input type="number" id="cooldownMs" value="8000" min="1000" step="500">
</div>
<label class="check">
  <input type="checkbox" id="useBridge" checked>
  양방배팅봇 신호 우선 사용
</label>
<label class="check">
  <input type="checkbox" id="preSync" checked>
  실시간 금액 동기화 (무장 없이도 텐텐뱃 기준 → BC.Game 자동 입력)
</label>

<div class="btn-row">
  <button id="armBtn" class="btn primary">🔴 무장</button>
  <button id="disarmBtn" class="btn" disabled>해제</button>
</div>
<div class="btn-row">
  <button id="scanBtn" class="btn">🔍 배당 스캔</button>
  <button id="testBetBtn" class="btn">🧪 테스트 배팅 (수익률 무시)</button>
</div>

<div id="log" class="log"></div>

<script src="sites_config.js"></script>
<script src="odds.js"></script>
<script src="bti_read.js"></script>
<script src="engine.js"></script>
<script src="poly_read.js"></script>
<script src="panel.js"></script>
</body>
</html>
