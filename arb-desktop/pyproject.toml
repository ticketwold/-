[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arb-desktop"
version = "1.3.1"
description = "양방 배팅 데스크톱 — WebSocket/Network → Playwright → OCR 다중 감지"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "orjson>=3.10",
  "playwright>=1.44",
  "PyQt6>=6.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "websockets>=12.0",
]

[project.optional-dependencies]
ocr = ["opencv-python-headless>=4.10", "pytesseract>=0.3.10", "mss>=9.0"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
arb-desktop = "arb_desktop.main:main"
arb-verify-bc-live = "arb_desktop.validation.verify_bc_live:main"
arb-verify-betslip = "arb_desktop.betslip.verify_betslip:main"
arb-verify-betslips = "arb_desktop.betslip.verify_betslips:main"
arb-run-auto-betslip = "arb_desktop.betslip.run_auto:main"
arb-run-bridge = "arb_desktop.betslip.run_bridge:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arb_desktop*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
