name: Extension Release

on:
  push:
    tags:
      - "arb-extension-v*"

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package extension zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#arb-extension-v}"
          cd chrome-extension
          zip -r "../arb-extension-v${VER}.zip" . -x "*.DS_Store" "test_*" "stake_actions.js"
          ls -lh "../arb-extension-v${VER}.zip"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#arb-extension-v}"
          ZIP="arb-extension-v${VER}.zip"
          gh release create "$TAG" "$ZIP" \
            --title "arb-extension v${VER}" \
            --notes "Standalone Chrome extension v${VER} — X10 odds fix. Load unpacked in chrome://extensions"
